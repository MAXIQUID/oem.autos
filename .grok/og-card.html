<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Oswald";
        src: url("fonts/Oswald-500.ttf") format("truetype");
        font-weight: 500;
        font-style: normal;
      }
      @font-face {
        font-family: "Oswald";
        src: url("fonts/Oswald-600.ttf") format("truetype");
        font-weight: 600;
        font-style: normal;
      }
      @font-face {
        font-family: "Oswald";
        src: url("fonts/Oswald-700.ttf") format("truetype");
        font-weight: 700;
        font-style: normal;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #0c0d0b;
      }
      .stage {
        position: relative;
        width: 1200px;
        height: 630px;
        background: #0c0d0b;
        color: #0c0d0b;
        font-family: Oswald, "Liberation Sans Narrow", sans-serif;
      }
      .edge-bars {
        position: absolute;
        top: 36px;
        bottom: 36px;
        width: 22px;
        display: flex;
        gap: 3px;
      }
      .edge-bars.left {
        left: 18px;
      }
      .edge-bars.right {
        right: 18px;
        flex-direction: row-reverse;
      }
      .edge-bars span {
        display: block;
        height: 100%;
        background: #c5ccc0;
        opacity: 0.28;
      }
      .plate {
        position: absolute;
        inset: 48px 64px;
        background: #efece4;
        border-radius: 6px;
        box-shadow:
          0 0 0 1px #9a9c93,
          0 18px 40px rgba(0, 0, 0, 0.35);
        overflow: hidden;
      }
      .header {
        height: 38px;
        background: #c5ccc0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: #0c0d0b;
      }
      .frame {
        position: absolute;
        inset: 50px 22px 22px;
        border: 1.5px solid #0c0d0b;
        pointer-events: none;
      }
      .frame::after {
        content: "";
        position: absolute;
        inset: 6px;
        border: 1px solid #9a9c93;
      }
      .lockup {
        position: absolute;
        inset: 50px 0 78px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .mark {
        width: 52px;
        height: 32px;
        margin-bottom: 18px;
      }
      h1 {
        margin: 0;
        font-size: 128px;
        font-weight: 700;
        letter-spacing: -0.035em;
        line-height: 0.9;
        color: #0c0d0b;
        text-transform: none;
      }
      .tag {
        margin-top: 18px;
        font-size: 18px;
        font-weight: 500;
        letter-spacing: 0.46em;
        text-indent: 0.46em;
        color: #9a9c93;
        text-transform: uppercase;
      }
      .foot {
        position: absolute;
        left: 36px;
        right: 36px;
        bottom: 36px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #0c0d0b;
      }
      .barcode {
        display: flex;
        align-items: stretch;
        height: 28px;
        gap: 2px;
        flex: 0 0 auto;
      }
      .barcode i {
        display: block;
        background: #0c0d0b;
        height: 100%;
      }
      .rivet {
        position: absolute;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #efece4, #9a9c93 55%, #0c0d0b);
        box-shadow: 0 0 0 1px #0c0d0b;
      }
      .grain {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: 0.09;
        mix-blend-mode: multiply;
      }
      .ticks {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        top: 96px;
        width: 640px;
        height: 8px;
        background: repeating-linear-gradient(
          90deg,
          #0c0d0b 0 1px,
          transparent 1px 16px
        );
        opacity: 0.35;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="edge-bars left">
        <span style="width: 7px"></span>
        <span style="width: 2px"></span>
        <span style="width: 4px"></span>
        <span style="width: 2px"></span>
        <span style="width: 6px"></span>
      </div>
      <div class="edge-bars right">
        <span style="width: 6px"></span>
        <span style="width: 2px"></span>
        <span style="width: 5px"></span>
        <span style="width: 2px"></span>
        <span style="width: 7px"></span>
      </div>
      <div class="plate">
        <div class="header">
          <span>Original Equipment</span>
          <span>VIN-Native Catalog</span>
        </div>
        <div class="frame"></div>
        <div class="ticks"></div>
        <div class="lockup">
          <svg class="mark" viewBox="0 0 52 32" aria-hidden="true">
            <rect x="1" y="4" width="50" height="24" rx="2" fill="none" stroke="#0c0d0b" stroke-width="2" />
            <circle cx="18" cy="16" r="7" fill="none" stroke="#0c0d0b" stroke-width="3" />
            <rect x="29" y="9.2" width="3.2" height="13.6" fill="#0c0d0b" />
            <rect x="29" y="9.2" width="12" height="3.2" fill="#0c0d0b" />
            <rect x="29" y="14.4" width="9.2" height="3.2" fill="#0c0d0b" />
            <rect x="29" y="19.6" width="12" height="3.2" fill="#0c0d0b" />
          </svg>
          <h1>OEM.autos</h1>
          <div class="tag">Factory Original Equipment</div>
        </div>
        <div class="foot">
          <div class="barcode" aria-hidden="true">
            <i style="width: 4px"></i>
            <i style="width: 2px"></i>
            <i style="width: 5px"></i>
            <i style="width: 2px"></i>
            <i style="width: 3px"></i>
            <i style="width: 6px"></i>
            <i style="width: 2px"></i>
            <i style="width: 4px"></i>
            <i style="width: 2px"></i>
            <i style="width: 7px"></i>
            <i style="width: 2px"></i>
            <i style="width: 3px"></i>
          </div>
          <div>Used OEM Parts · Salvage Documented</div>
        </div>
        <div class="rivet" style="top: 50px; left: 14px"></div>
        <div class="rivet" style="top: 50px; right: 14px"></div>
        <div class="rivet" style="bottom: 14px; left: 14px"></div>
        <div class="rivet" style="bottom: 14px; right: 14px"></div>
        <svg class="grain" xmlns="http://www.w3.org/2000/svg" width="1200" height="630">
          <filter id="g">
            <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" />
          </filter>
          <rect width="100%" height="100%" filter="url(#g)" />
        </svg>
      </div>
    </div>
  </body>
</html>
